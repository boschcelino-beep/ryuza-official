const list=document.getElementById('list'), search=document.getElementById('search'), empty=document.getElementById('empty');
function render(){
 const q=search.value.trim().toLowerCase();
 const found=DATA.filter(x=>x.name.toLowerCase().includes(q));
 list.innerHTML='';
 const frag=document.createDocumentFragment();
 found.forEach((skin,i)=>{
  const card=document.createElement('section');card.className='item';
  const title=document.createElement('div');title.className='name';title.textContent=skin.name;
  const row=document.createElement('div');row.className='controls';
  const sel=document.createElement('select');sel.setAttribute('aria-label','Pilih replace '+skin.name);
  skin.options.forEach((opt,n)=>{const o=document.createElement('option');o.value=String(n);o.textContent=opt.label;sel.appendChild(o)});
  const link=document.createElement('a');link.className='go';link.textContent='Download';link.href=skin.options[0]?.url||'#';link.target='_blank';link.rel='noopener noreferrer';
  sel.addEventListener('change',()=>{link.href=skin.options[Number(sel.value)].url});
  const meta=document.createElement('div');meta.className='meta';meta.textContent=skin.options.length+' pilihan replace';
  row.append(sel,link);card.append(title,row,meta);frag.appendChild(card);
 });
 list.appendChild(frag);empty.hidden=found.length!==0;
}
search.addEventListener('input',render);render();
